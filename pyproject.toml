[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ppo-air-hockey"
version = "0.1.0"
description = "PPO training in a custom MuJoCo air hockey environment"
requires-python = ">=3.10"
dependencies = [
  "gymnasium==1.1.1",
  "mujoco==3.3.1",
  "numpy==2.2.4",
  "pygame>=2.1.3",
  "stable-baselines3==2.6.0",
  "tensorboard==2.19.0",
  "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["gymnasium_env"]
